# Mosaic — local dev compose. Set EVENT_MODE below or via shell:
#   EVENT_MODE=remembrance docker compose up
#
# After first boot, drop seed photos into:
#   <data-dir>/seeds/<EVENT_MODE>/
# and restart the api container.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: ghcr.io/aluxh/mosaic-api:dev
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      PORT: "3000"
      HOST: 0.0.0.0
      EVENT_MODE: ${EVENT_MODE:-celebration}
      EVENT_TITLE: ${EVENT_TITLE:-}
      EVENT_EYEBROW: ${EVENT_EYEBROW:-}
      EVENT_DATELINE: ${EVENT_DATELINE:-}
      EVENT_PLACE: ${EVENT_PLACE:-}
      EVENT_INVITATION: ${EVENT_INVITATION:-}
      EVENT_BRAND_SUB: ${EVENT_BRAND_SUB:-}
      EVENT_SHORT_CODE: ${EVENT_SHORT_CODE:-}
      TOKEN_SECRET: ${TOKEN_SECRET:-}
      # TOKEN_TTL_DAYS: "14"   # validity window for newly minted tokens
    volumes:
      - ./data:/data
    expose:
      - "3000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: ghcr.io/aluxh/mosaic-web:dev
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      # Read-only access to the same data dir so nginx can serve photos
      # without round-tripping through the API.
      - ./data:/var/lib/mosaic-data:ro
