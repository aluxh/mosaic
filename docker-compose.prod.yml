# Mosaic — production compose for Synology / Dockhand.
#
# Pulls pre-built images from GHCR; no local build required.
# Paste this file into Dockhand's stack editor and deploy.
#
# BEFORE DEPLOYING: set EVENT_MODE below to match your event type.
#   celebration  — weddings, graduations, birthdays
#   remembrance  — memorials, funerals
#
# Each event should have its own stack with its own data path:
#   /volume1/docker/<event-name>/data
#
# SECRETS POLICY: all secrets (admin password, HMAC keys, etc. — none in v0.1)
# MUST be passed via environment: variables here. Never bake secrets into the
# image or commit a .env file to the repo.

services:
  api:
    image: ghcr.io/aluxh/mosaic-api:latest
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      PORT: "3000"
      HOST: 0.0.0.0
      EVENT_MODE: celebration   # change to remembrance for a memorial
      # Optional: override the event copy without rebuilding the image.
      # Leave any line commented out to keep the built-in seed value.
      # EVENT_TITLE: "Grace Mei Wong"           # name on the title card
      # EVENT_EYEBROW: "In loving memory of"    # small label above the name
      # EVENT_DATELINE: "1925 — 2026"           # dates below the name
      # EVENT_PLACE: "Hong Kong, 1925"          # venue / context line
      # EVENT_INVITATION: "Share a memory."     # invitation text on title card
      # EVENT_BRAND_SUB: "In remembrance · Grace"  # subtitle under "Mosaic" in chrome
      # EVENT_SHORT_CODE: "GM26"                # short code shown on the contribute button
    volumes:
      - /volume1/docker/mosaic/data:/data
    expose:
      - "3000"

  web:
    image: ghcr.io/aluxh/mosaic-web:latest
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      # Read-only access so nginx can serve photos without round-tripping
      # through the API.
      - /volume1/docker/mosaic/data:/var/lib/mosaic-data:ro
